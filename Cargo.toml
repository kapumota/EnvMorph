[package]
name = "envmorph"
version = "0.1.0"
edition = "2021"
description = "Infraestructura experimental para pruebas metamórficas ambientales de workflows Unix"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[profile.release]
opt-level = 3
lto = true
strip = true
